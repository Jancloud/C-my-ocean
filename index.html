<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态心流 - 情绪粒子海洋</title>
    <style>
        /* 页面基础重置，确保全屏无滚动条 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
        }

        /* 画布填满整个视口 */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 极简精致的顶部UI覆盖层 */
        .overlay {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.3em;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 300;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            margin-bottom: 0.5rem;
            transition: color 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .subtitle {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.35);
            transition: color 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 功能控制栏：声效切换 & 沙盒齿轮 */
        .top-controls {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 15;
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.65);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        /* 底部总体控制区域 */
        .control-container {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 440px;
            padding: 0 20px;
        }

        /* 半透明极简拟态输入框 */
        .emotion-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 12px 24px;
            color: #ffffff;
            font-size: 0.88rem;
            outline: none;
            text-align: center;
            letter-spacing: 0.1em;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .emotion-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .emotion-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.8rem;
        }

        /* 可点击的情绪快捷面板 */
        .mood-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            pointer-events: auto;
            width: 100%;
        }

        .mood-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 5px 12px;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 0.05em;
        }

        .mood-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        /* 情绪按钮被激活时的霓虹灯效 */
        .mood-btn.active-mood {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
        }

        /* 柔和的提示语 */
        .tip-text {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            pointer-events: none;
            text-align: center;
            transition: color 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ------------------ 🛠️ 侧边沙盒面板 ------------------ */
        .sandbox-panel {
            position: absolute;
            top: 0;
            right: -320px; 
            width: 320px;
            height: 100%;
            background: rgba(10, 10, 10, 0.85);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 20;
            padding: 100px 30px 40px 30px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            transition: right 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            color: #ffffff;
            pointer-events: auto;
        }

        .sandbox-panel.open {
            right: 0;
        }

        .sandbox-header {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            text-transform: uppercase;
        }

        .sandbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sandbox-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.1em;
        }

        .sandbox-val {
            color: rgba(255, 255, 255, 0.85);
            font-family: monospace;
        }

        .sandbox-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            transition: background 0.3s;
        }

        .sandbox-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transition: transform 0.2s, background 0.3s;
        }

        .sandbox-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .cruise-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            text-align: center;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .cruise-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .cruise-btn.active {
            background: rgba(168, 230, 207, 0.15);
            border-color: #a8e6cf;
            color: #a8e6cf;
            box-shadow: 0 0 10px rgba(168, 230, 207, 0.1);
        }
    </style>
</head>
<body>

    <div class="overlay">
        <div id="appTitle" class="title">星空心流</div>
        <div id="appSubtitle" class="subtitle">INPUT YOUR MINDVERSE</div>
    </div>

    <div class="top-controls">
        <div id="audioToggle" class="icon-btn" title="切换声效声音">🔇</div>
        <div id="gearToggle" class="icon-btn" title="高级沙盒微调">⚙️</div>
    </div>

    <div id="sandbox" class="sandbox-panel">
        <div class="sandbox-header">造物主沙盒</div>
        
        <div class="sandbox-group">
            <div class="sandbox-label">
                <span>粒子数量</span>
                <span id="pCountVal" class="sandbox-val">280</span>
            </div>
            <input type="range" id="pCountSlider" class="sandbox-slider" min="50" max="800" step="10" value="280">
        </div>

        <div class="sandbox-group">
            <div class="sandbox-label">
                <span>荧光晕半径</span>
                <span id="pGlowVal" class="sandbox-val">3.8</span>
            </div>
            <input type="range" id="pGlowSlider" class="sandbox-slider" min="1.0" max="8.0" step="0.2" value="3.8">
        </div>

        <div class="sandbox-group">
            <div class="sandbox-label">
                <span>吸引力强度</span>
                <span id="pAttractVal" class="sandbox-val">1.0</span>
            </div>
            <input type="range" id="pAttractSlider" class="sandbox-slider" min="0.2" max="3.0" step="0.1" value="1.0">
        </div>

        <button id="cruiseBtn" class="cruise-btn">🛰️ 开启自动屏保巡航</button>
    </div>

    <div class="control-container">
        <input 
            type="text" 
            id="emotionInput" 
            class="emotion-input" 
            placeholder="输入任意文字，实时定制你的宇宙..." 
            autocomplete="off"
        >
        
        <div class="mood-panel" id="moodPanel">
            <button class="mood-btn" data-emotion="星空之海">✨ 星空之海</button>
            <button class="mood-btn" data-emotion="赛博朋克">🌆 赛博朋克</button>
            <button class="mood-btn" data-emotion="暗夜极光">🌌 暗夜极光</button>
            <button class="mood-btn" data-emotion="太阳耀斑">🔥 太阳耀斑</button>
            <button class="mood-btn" data-emotion="黄金熔岩">🌋 黄金熔岩</button>
            <button class="mood-btn" data-emotion="桃之夭夭">🌸 桃之夭夭</button>
        </div>

        <div id="tipText" class="tip-text">输入任意中英文词汇，解开隐藏的物理光谱</div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 🎵 ----------------- WEB AUDIO API 声音引擎 -----------------
        let audioCtx = null;
        let isAudioMuted = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSfx(waveType, freq, vol, attack, decay, release, normX) {
            if (isAudioMuted) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

            if (isNaN(freq) || freq < 20) freq = 220;

            osc.type = waveType;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            if (panner) {
                const panVal = (normX * 2) - 1; 
                panner.pan.setValueAtTime(panVal, audioCtx.currentTime);
                osc.connect(panner);
                panner.connect(gainNode);
            } else {
                osc.connect(gainNode);
            }

            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(vol, now + attack);
            gainNode.gain.exponentialRampToValueAtTime(vol * 0.1, now + attack + decay);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, now + attack + decay + release);

            osc.start(now);
            osc.stop(now + attack + decay + release + 0.1);
        }

        const audioToggle = document.getElementById('audioToggle');
        audioToggle.addEventListener('click', (e) => {
            isAudioMuted = !isAudioMuted;
            if (!isAudioMuted) {
                initAudio();
                audioToggle.innerText = '🔊';
                audioToggle.style.color = '#a8e6cf';
                playSfx('sine', 440, 0.1, 0.1, 0.5, 0.5, 0.5);
            } else {
                audioToggle.innerText = '🔇';
                audioToggle.style.color = 'rgba(255, 255, 255, 0.65)';
            }
            e.stopPropagation();
        });

        // 🛠️ ----------------- 沙盒控制系统 -----------------
        const sandbox = document.getElementById('sandbox');
        const gearToggle = document.getElementById('gearToggle');
        
        gearToggle.addEventListener('click', (e) => {
            sandbox.classList.toggle('open');
            e.stopPropagation();
        });

        sandbox.addEventListener('mousedown', e => e.stopPropagation());
        sandbox.addEventListener('touchstart', e => e.stopPropagation(), {passive: true});

        window.addEventListener('mousedown', (e) => {
            if (!sandbox.contains(e.target) && e.target !== gearToggle) {
                sandbox.classList.remove('open');
            }
        });

        let userGlowMultiplier = 1.0; 
        let userAttractMultiplier = 1.0; 

        const pCountSlider = document.getElementById('pCountSlider');
        const pCountVal = document.getElementById('pCountVal');
        pCountSlider.addEventListener('input', (e) => {
            const count = parseInt(e.target.value);
            pCountVal.innerText = count;
            adjustParticleCount(count);
        });

        const pGlowSlider = document.getElementById('pGlowSlider');
        const pGlowVal = document.getElementById('pGlowVal');
        pGlowSlider.addEventListener('input', (e) => {
            userGlowMultiplier = parseFloat(e.target.value) / 3.8;
            pGlowVal.innerText = e.target.value;
        });

        const pAttractSlider = document.getElementById('pAttractSlider');
        const pAttractVal = document.getElementById('pAttractVal');
        pAttractSlider.addEventListener('input', (e) => {
            userAttractMultiplier = parseFloat(e.target.value);
            pAttractVal.innerText = e.target.value;
        });

        function adjustParticleCount(newCount) {
            const diff = newCount - particles.length;
            if (diff > 0) {
                for (let i = 0; i < diff; i++) {
                    particles.push(new Particle());
                }
            } else if (diff < 0) {
                particles.splice(newCount);
            }
        }

        let isAutoCruising = false;
        let cruiseTime = 0;
        const cruiseBtn = document.getElementById('cruiseBtn');

        function deactivateCruise() {
            if (isAutoCruising) {
                isAutoCruising = false;
                cruiseBtn.classList.remove('active');
                cruiseBtn.innerText = '🛰️ 开启自动屏保巡航';
            }
        }

        cruiseBtn.addEventListener('click', (e) => {
            isAutoCruising = !isAutoCruising;
            if (isAutoCruising) {
                cruiseBtn.classList.add('active');
                cruiseBtn.innerText = '🛰️ 屏保巡航运行中...';
                mouse.isActive = true;
                initAudio();
                setTimeout(() => {
                    if (isAutoCruising) sandbox.classList.remove('open');
                }, 300);
            } else {
                cruiseBtn.classList.remove('active');
                cruiseBtn.innerText = '🛰️ 开启自动屏保巡航';
            }
            e.stopPropagation();
        });

        // 🔮 ----------------- 方案一：情感流体哈希计算核心 -----------------
        // 初始默认状态常数
        const currentConfig = {
            primaryColor: { r: 255, g: 255, b: 255 },
            glowColor: { r: 255, g: 254, b: 230 },
            speed: 1.0,
            ease: 1.0,
            flicker: 1.0,
            bgAlpha: 0.08,
            waveType: 'sine'
        };

        const targetConfig = JSON.parse(JSON.stringify(currentConfig));

        // 【线性插值辅助函数】—— 用于平滑数值过渡
        function lerp(start, end, amt) {
            return start + (end - start) * amt;
        }

        // 核心算法：将字符串哈希映射成一整套物理与色彩宇宙
        function parseTextToPhysics(str) {
            deactivateCruise(); // 用户打字时结束巡航
            const text = str.trim();

            if (text === '') {
                // 如果空，重置回原初暖白状态
                targetConfig.primaryColor = { r: 255, g: 255, b: 255 };
                targetConfig.glowColor = { r: 255, g: 254, b: 230 };
                targetConfig.speed = 1.0;
                targetConfig.ease = 1.0;
                targetConfig.flicker = 1.0;
                targetConfig.bgAlpha = 0.08;
                targetConfig.waveType = 'sine';
                
                document.getElementById('appTitle').innerText = '星空心流';
                document.getElementById('appTitle').style.color = '#ffffff';
                document.getElementById('appSubtitle').innerText = 'INPUT YOUR MINDVERSE';
                return;
            }

            // 1. 计算非线性累加字符串哈希值值
            let hash = 0;
            for (let i = 0; i < text.length; i++) {
                hash = text.charCodeAt(i) + ((hash << 5) - hash);
                hash = hash & hash; // 变成 32位整型
            }
            const absHash = Math.abs(hash);

            // 2. 映射粒子亮芯色与外环荧光色（利用正弦色彩环保证色彩高饱和且和谐）
            const rP = Math.floor(Math.sin(absHash * 0.017 + 0) * 127 + 128);
            const gP = Math.floor(Math.sin(absHash * 0.017 + 2) * 127 + 128);
            const bP = Math.floor(Math.sin(absHash * 0.017 + 4) * 127 + 128);
            targetConfig.primaryColor = { r: rP, g: gP, b: bP };

            const rG = Math.floor(Math.sin(absHash * 0.035 + 1) * 110 + 110);
            const gG = Math.floor(Math.sin(absHash * 0.035 + 3) * 110 + 110);
            const bG = Math.floor(Math.sin(absHash * 0.035 + 5) * 110 + 110);
            targetConfig.glowColor = { r: rG, g: gG, b: bG };

            // 3. 映射物理特性（将数值严密收束在安全、好看的常数区间内）
            targetConfig.speed = 0.2 + (absHash % 100) / 100 * 3.8;
            targetConfig.ease = 0.25 + ((absHash >> 4) % 100) / 100 * 2.75;
            targetConfig.flicker = 0.3 + ((absHash >> 8) % 100) / 100 * 4.7;
            targetConfig.bgAlpha = 0.03 + ((absHash >> 12) % 100) / 100 * 0.19;

            // 4. 声音波形类型映射
            const waveTypes = ['sine', 'triangle', 'sawtooth', 'square'];
            targetConfig.waveType = waveTypes[absHash % 4];

            // 5. 联动实时刷新页面 UI 的英文字幕与霓虹文字颜色
            const titleEl = document.getElementById('appTitle');
            const subtitleEl = document.getElementById('appSubtitle');
            
            titleEl.innerText = text;
            titleEl.style.color = `rgb(${rP}, ${gP}, ${bP})`;
            subtitleEl.innerText = `SPECTRUM HASH: 0x${absHash.toString(16).toUpperCase()}`;
            subtitleEl.style.color = `rgba(${rG}, ${gG}, ${bG}, 0.5)`;
        }

        // 监听打字与小标签点击
        const emotionInput = document.getElementById('emotionInput');
        const moodPanel = document.getElementById('moodPanel');

        emotionInput.addEventListener('input', (e) => {
            parseTextToPhysics(e.target.value);
            moodPanel.querySelectorAll('.mood-btn').forEach(b => b.className = 'mood-btn');
        });

        moodPanel.addEventListener('click', (e) => {
            const btn = e.target.closest('.mood-btn');
            if (!btn) return;
            const textVal = btn.getAttribute('data-emotion');
            emotionInput.value = textVal;
            parseTextToPhysics(textVal);

            moodPanel.querySelectorAll('.mood-btn').forEach(b => b.className = 'mood-btn');
            btn.classList.add('active-mood');
        });

        function updateInterpolation() {
            const rate = 0.03; // 丝滑缓慢晕染过渡
            currentConfig.primaryColor.r = lerp(currentConfig.primaryColor.r, targetConfig.primaryColor.r, rate);
            currentConfig.primaryColor.g = lerp(currentConfig.primaryColor.g, targetConfig.primaryColor.g, rate);
            currentConfig.primaryColor.b = lerp(currentConfig.primaryColor.b, targetConfig.primaryColor.b, rate);

            currentConfig.glowColor.r = lerp(currentConfig.glowColor.r, targetConfig.glowColor.r, rate);
            currentConfig.glowColor.g = lerp(currentConfig.glowColor.g, targetConfig.glowColor.g, rate);
            currentConfig.glowColor.b = lerp(currentConfig.glowColor.b, targetConfig.glowColor.b, rate);

            currentConfig.speed = lerp(currentConfig.speed, targetConfig.speed, rate);
            currentConfig.ease = lerp(currentConfig.ease, targetConfig.ease, rate);
            currentConfig.flicker = lerp(currentConfig.flicker, targetConfig.flicker, rate);
            currentConfig.bgAlpha = lerp(currentConfig.bgAlpha, targetConfig.bgAlpha, rate);
            currentConfig.waveType = targetConfig.waveType;
        }

        // 🖱️ ----------------- 鼠标与触摸状态管理 -----------------
        const mouse = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            targetX: window.innerWidth / 2,
            targetY: window.innerHeight / 2,
            isActive: false
        };

        let lastSfxTime = 0;
        const sfxThrottle = 65; 

        function updateMouse(e) {
            // 如果开启了自动巡航，用户的鼠标滑动不会打断巡航
            if (isAutoCruising) {
                return; 
            }

            mouse.isActive = true;
            if (e.touches) {
                mouse.targetX = e.touches[0].clientX;
                mouse.targetY = e.touches[0].clientY;
            } else {
                mouse.targetX = e.clientX;
                mouse.targetY = e.clientY;
            }

            const now = performance.now();
            if (now - lastSfxTime > sfxThrottle && mouse.isActive) {
                const normX = mouse.targetX / canvas.width;
                const normY = mouse.targetY / canvas.height;
                const freq = 1100 - (normY * 980);
                playSfx(currentConfig.waveType, freq, 0.08, 0.1, 0.4, 0.6, normX);
                lastSfxTime = now;
            }
        }

        window.addEventListener('mousemove', updateMouse);
        window.addEventListener('touchmove', updateMouse, { passive: true });
        window.addEventListener('mouseleave', () => { 
            // 自动巡航状态下，即使鼠标移出屏幕，背景吸引器也不应失效
            if (!isAutoCruising) {
                mouse.isActive = false; 
            }
        });

        // 💥 ----------------- 矢量动力冲击波 -----------------
        class Shockwave {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = 260 * currentConfig.speed; 
                this.speed = 9 * currentConfig.speed;      
                this.alpha = 1.0;
            }

            update() {
                this.radius += this.speed;
                this.alpha = 1 - (this.radius / this.maxRadius);
                return this.radius < this.maxRadius;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(${Math.round(currentConfig.glowColor.r)}, ${Math.round(currentConfig.glowColor.g)}, ${Math.round(currentConfig.glowColor.b)}, ${this.alpha * 0.4})`;
                ctx.lineWidth = 2; 
                ctx.stroke();
            }
        }

        const shockwaves = [];

        function triggerExplosion(x, y) {
            if (isAutoCruising) deactivateCruise();

            if (!isAudioMuted) {
                const normX = x / canvas.width;
                const normY = y / canvas.height;
                const freq = 1100 - (normY * 980);
                playSfx(currentConfig.waveType, freq * 0.5, 0.15, 0.01, 0.3, 0.5, normX);
                setTimeout(() => {
                    playSfx('sine', freq * 0.25, 0.1, 0.05, 0.4, 0.6, normX);
                }, 60);
            }

            shockwaves.push(new Shockwave(x, y));

            particles.forEach(p => {
                const dx = p.x - x;
                const dy = p.y - y;
                const dist = Math.hypot(dx, dy);
                const maxPushRadius = 280 * currentConfig.speed;

                if (dist < maxPushRadius && dist > 0) {
                    const force = (1 - dist / maxPushRadius) * 25 * currentConfig.speed;
                    p.pushX += (dx / dist) * force;
                    p.pushY += (dy / dist) * force;
                }
            });
        }

        window.addEventListener('mousedown', (e) => {
            if (e.target.id === 'emotionInput' || e.target.closest('#moodPanel') || e.target.closest('#sandbox') || e.target.closest('.top-controls')) return;
            triggerExplosion(e.clientX, e.clientY);
        });

        window.addEventListener('touchstart', (e) => {
            if (e.target.id === 'emotionInput' || e.target.closest('#moodPanel') || e.target.closest('#sandbox') || e.target.closest('.top-controls')) return;
            const touch = e.touches[0];
            triggerExplosion(touch.clientX, touch.clientY);
        }, { passive: true });


        // 🌟 ----------------- 粒子系统核心引擎 -----------------
        class Particle {
            constructor() {
                this.reset();
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
            }

            reset() {
                this.size = Math.random() * 1.6 + 0.6; 
                this.baseAlpha = Math.random() * 0.5 + 0.3; 
                this.alpha = this.baseAlpha;
                
                this.flickerSpeed = Math.random() * 0.03 + 0.01;
                this.flickerOffset = Math.random() * Math.PI * 2;
                
                this.baseEase = Math.random() * 0.04 + 0.01; 
                
                this.offsetX = (Math.random() - 0.5) * 160;
                this.offsetY = (Math.random() - 0.5) * 160;
                
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;

                this.pushX = 0;
                this.pushY = 0;
            }

            update(tick) {
                const tickFactor = tick * currentConfig.flicker;
                this.alpha = this.baseAlpha + Math.sin(tickFactor * this.flickerSpeed + this.flickerOffset) * 0.25;
                if (this.alpha < 0) this.alpha = 0;

                let targetX, targetY;
                const dynamicOffsetAmp = 160 * currentConfig.speed;

                if (mouse.isActive) {
                    targetX = mouse.x + (this.offsetX / 160) * dynamicOffsetAmp;
                    targetY = mouse.y + (this.offsetY / 160) * dynamicOffsetAmp;
                    
                    this.offsetX += Math.sin(tickFactor * 0.01 + this.flickerOffset) * 0.3 * currentConfig.speed;
                    this.offsetY += Math.cos(tickFactor * 0.01 + this.flickerOffset) * 0.3 * currentConfig.speed;
                } else {
                    const centerAngle = tick * 0.001 * currentConfig.speed + this.flickerOffset;
                    targetX = (canvas.width / 2) + Math.cos(centerAngle) * 100;
                    targetY = (canvas.height / 2) + Math.sin(centerAngle) * 100;
                }

                const activeEase = this.baseEase * currentConfig.ease * userAttractMultiplier;
                this.x += (targetX - this.x) * activeEase;
                this.y += (targetY - this.y) * activeEase;

                this.pushX *= 0.92;
                this.pushY *= 0.92;
                this.x += this.pushX;
                this.y += this.pushY;

                this.x += this.vx * currentConfig.speed;
                this.y += this.vy * currentConfig.speed;
            }

            draw() {
                const rP = Math.round(currentConfig.primaryColor.r);
                const gP = Math.round(currentConfig.primaryColor.g);
                const bP = Math.round(currentConfig.primaryColor.b);

                const rG = Math.round(currentConfig.glowColor.r);
                const gG = Math.round(currentConfig.glowColor.g);
                const bG = Math.round(currentConfig.glowColor.b);

                const dynamicSize = this.size;
                const glowSizeMultiplier = 3.8 * userGlowMultiplier;

                ctx.beginPath();
                ctx.arc(this.x, this.y, dynamicSize, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${rP}, ${gP}, ${bP}, ${this.alpha})`;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x, this.y, dynamicSize * glowSizeMultiplier, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${rG}, ${gG}, ${bG}, ${this.alpha * 0.35})`;
                ctx.fill();
            }
        }

        const particles = [];
        adjustParticleCount(280); 

        let tick = 0;

        function animate() {
            updateInterpolation();

            // 动态哈希流光拖尾
            ctx.fillStyle = `rgba(0, 0, 0, ${currentConfig.bgAlpha})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 自动巡航屏保轨迹
            if (isAutoCruising) {
                mouse.isActive = true; 
                cruiseTime += 0.012;

                mouse.targetX = canvas.width / 2 + Math.cos(cruiseTime * 0.8) * (canvas.width * 0.38) * Math.sin(cruiseTime * 0.4);
                mouse.targetY = canvas.height / 2 + Math.sin(cruiseTime * 1.1) * (canvas.height * 0.35);

                const now = performance.now();
                if (now - lastSfxTime > 250) { 
                    const normX = mouse.targetX / canvas.width;
                    const normY = mouse.targetY / canvas.height;
                    const freq = 1100 - (normY * 980);
                    playSfx(currentConfig.waveType, freq, 0.08, 0.1, 0.4, 0.6, normX);
                    lastSfxTime = now;
                }
            }

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const s = shockwaves[i];
                if (s.update()) {
                    s.draw();
                } else {
                    shockwaves.splice(i, 1);
                }
            }

            const mouseEase = 0.08 * currentConfig.ease * userAttractMultiplier;
            mouse.x += (mouse.targetX - mouse.x) * mouseEase;
            mouse.y += (mouse.targetY - mouse.y) * mouseEase;

            tick++;

            for (let i = 0; i < particles.length; i++) {
                particles[i].update(tick);
                particles[i].draw();
            }

            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
