<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萤火虫之舞 - 情绪粒子海洋</title>
    <style>
        /* 页面基础重置，确保全屏无滚动条 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
        }

        /* 画布填满整个视口 */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 极简精致的顶部UI覆盖层 */
        .overlay {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.3em;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 300;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            margin-bottom: 0.5rem;
            transition: color 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .subtitle {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.35);
            transition: color 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 功能控制栏：声效切换 & 沙盒齿轮 */
        .top-controls {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 15;
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.65);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        /* 底部总体控制区域 */
        .control-container {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 440px;
            padding: 0 20px;
        }

        /* 半透明极简拟态输入框 */
        .emotion-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 10px 24px;
            color: #ffffff;
            font-size: 0.85rem;
            outline: none;
            text-align: center;
            letter-spacing: 0.1em;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .emotion-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .emotion-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.8rem;
        }

        /* 可点击的情绪快捷面板 */
        .mood-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            pointer-events: auto;
            width: 100%;
        }

        .mood-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 5px 12px;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 0.05em;
        }

        .mood-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        /* 情绪按钮被激活时的霓虹灯效 */
        .mood-btn.active-default {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
        }

        .mood-btn.active-melancholy {
            background: rgba(120, 180, 255, 0.12);
            color: #78b4ff;
            border-color: rgba(120, 180, 255, 0.4);
            box-shadow: 0 0 10px rgba(120, 180, 255, 0.2);
        }

        .mood-btn.active-energetic {
            background: rgba(255, 60, 0, 0.12);
            color: #ff3c00;
            border-color: rgba(255, 60, 0, 0.4);
            box-shadow: 0 0 10px rgba(255, 60, 0, 0.2);
        }

        .mood-btn.active-calm {
            background: rgba(168, 230, 207, 0.12);
            color: #a8e6cf;
            border-color: rgba(168, 230, 207, 0.4);
            box-shadow: 0 0 10px rgba(168, 230, 207, 0.2);
        }

        .mood-btn.active-angry {
            background: rgba(255, 0, 60, 0.12);
            color: #ff003c;
            border-color: rgba(255, 0, 60, 0.4);
            box-shadow: 0 0 10px rgba(255, 0, 60, 0.2);
        }

        .mood-btn.active-romantic {
            background: rgba(255, 182, 193, 0.12);
            color: #ffb6c1;
            border-color: rgba(255, 182, 193, 0.4);
            box-shadow: 0 0 10px rgba(255, 182, 193, 0.2);
        }

        /* 柔和的提示语 */
        .tip-text {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            pointer-events: none;
            text-align: center;
            transition: color 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ------------------ 🛠️ 侧边沙盒面板 ------------------ */
        .sandbox-panel {
            position: absolute;
            top: 0;
            right: -320px; /* 默认隐藏 */
            width: 320px;
            height: 100%;
            background: rgba(10, 10, 10, 0.85);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 20;
            padding: 100px 30px 40px 30px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            transition: right 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            color: #ffffff;
            pointer-events: auto;
        }

        .sandbox-panel.open {
            right: 0;
        }

        .sandbox-header {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            text-transform: uppercase;
        }

        .sandbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sandbox-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.1em;
        }

        .sandbox-val {
            color: rgba(255, 255, 255, 0.85);
            font-family: monospace;
        }

        /* 自定义美观的 Slider */
        .sandbox-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            transition: background 0.3s;
        }

        .sandbox-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transition: transform 0.2s, background 0.3s;
        }

        .sandbox-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 屏保自巡航按钮 */
        .cruise-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            text-align: center;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .cruise-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .cruise-btn.active {
            background: rgba(168, 230, 207, 0.15);
            border-color: #a8e6cf;
            color: #a8e6cf;
            box-shadow: 0 0 10px rgba(168, 230, 207, 0.1);
        }
    </style>
</head>
<body>

    <div class="overlay">
        <div id="appTitle" class="title">萤火虫之舞</div>
        <div id="appSubtitle" class="subtitle">DANCE OF FIREFLIES</div>
    </div>

    <!-- 右上角快捷控制 -->
    <div class="top-controls">
        <div id="audioToggle" class="icon-btn" title="切换声效声音">🔇</div>
        <div id="gearToggle" class="icon-btn" title="高级沙盒微调">⚙️</div>
    </div>

    <!-- 右侧滑出的沙盒面板 -->
    <div id="sandbox" class="sandbox-panel">
        <div class="sandbox-header">造物主沙盒</div>
        
        <!-- 粒子数量 -->
        <div class="sandbox-group">
            <div class="sandbox-label">
                <span>粒子数量</span>
                <span id="pCountVal" class="sandbox-val">280</span>
            </div>
            <input type="range" id="pCountSlider" class="sandbox-slider" min="50" max="800" step="10" value="280">
        </div>

        <!-- 光晕半径 -->
        <div class="sandbox-group">
            <div class="sandbox-label">
                <span>荧光晕半径</span>
                <span id="pGlowVal" class="sandbox-val">3.8</span>
            </div>
            <input type="range" id="pGlowSlider" class="sandbox-slider" min="1.0" max="8.0" step="0.2" value="3.8">
        </div>

        <!-- 随动吸引力 -->
        <div class="sandbox-group">
            <div class="sandbox-label">
                <span>吸引力强度</span>
                <span id="pAttractVal" class="sandbox-val">1.0</span>
            </div>
            <input type="range" id="pAttractSlider" class="sandbox-slider" min="0.2" max="3.0" step="0.1" value="1.0">
        </div>

        <!-- 自动巡航开关（屏保模式） -->
        <button id="cruiseBtn" class="cruise-btn">🛰️ 开启自动屏保巡航</button>
    </div>

    <div class="control-container">
        <input 
            type="text" 
            id="emotionInput" 
            class="emotion-input" 
            placeholder="写下或点击下方配方改变情绪..." 
            autocomplete="off"
        >
        
        <!-- 交互面板：快捷情绪药水 -->
        <div class="mood-panel" id="moodPanel">
            <button class="mood-btn active-default" data-emotion="">🌱 默认</button>
            <button class="mood-btn" data-emotion="忧郁">💧 忧郁</button>
            <button class="mood-btn" data-emotion="平静">🕊️ 平静</button>
            <button class="mood-btn" data-emotion="浪漫">🌸 浪漫</button>
            <button class="mood-btn" data-emotion="能量">⚡ 能量</button>
            <button class="mood-btn" data-emotion="愤怒">🌋 愤怒</button>
        </div>

        <div id="tipText" class="tip-text">输入或点按情绪开启海洋变幻</div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 🌟 ----------------- 🎵 WEB AUDIO API 声音合成引擎 -----------------
        let audioCtx = null;
        let isAudioMuted = true;

        // 初始化音频上下文
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 触发自适应声音合成器
        function playSfx(emotion, normX, normY) {
            if (isAudioMuted) return;
            initAudio();
            if (!audioCtx) return;

            // 1. 创建声学节点
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

            // 2. 音高频率计算（鼠标越高音高越高，范围：120Hz 到 1200Hz）
            const minFreq = 120;
            const maxFreq = 1100;
            let freq = maxFreq - (normY * (maxFreq - minFreq));

            // 3. 情绪特异性乐音配置
            let waveType = 'sine';
            let attack = 0.05;
            let decay = 0.4;
            let sustain = 0.1;
            let release = 0.6;
            let vol = 0.15;

            switch(emotion) {
                case 'melancholy': // 忧郁：低沉舒缓的三角形电波，缓慢释放
                    waveType = 'triangle';
                    freq = freq * 0.4; // 降调低音
                    attack = 0.3;
                    decay = 0.8;
                    release = 1.5;
                    vol = 0.18;
                    break;
                case 'energetic': // 能量：清脆的锯齿脉冲
                    waveType = 'sawtooth';
                    attack = 0.02;
                    decay = 0.2;
                    release = 0.3;
                    vol = 0.06;
                    break;
                case 'calm': // 平静：纯净正弦波磬音
                    waveType = 'sine';
                    attack = 0.1;
                    decay = 1.0;
                    release = 2.0;
                    vol = 0.22;
                    break;
                case 'angry': // 愤怒：高能量强冲击方波（雷鸣）
                    waveType = 'square';
                    freq = freq * 0.35; // 毁灭低频
                    attack = 0.01;
                    decay = 0.3;
                    release = 0.6;
                    vol = 0.08;
                    break;
                case 'romantic': // 浪漫：和谐七度音和弦扫音
                    waveType = 'triangle';
                    attack = 0.15;
                    decay = 0.5;
                    release = 1.2;
                    vol = 0.14;
                    break;
                default: // 默认暖色：原木敲击般的温润音色
                    waveType = 'sine';
                    attack = 0.04;
                    decay = 0.3;
                    release = 0.5;
                    vol = 0.12;
                    break;
            }

            // 确保频率在合理范围
            if (isNaN(freq) || freq < 20) freq = 220;

            osc.type = waveType;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // 如果支持多声相，左右声道映射鼠标的 X 位置
            if (panner) {
                const panVal = (normX * 2) - 1; // 映射成 [-1, 1]
                panner.pan.setValueAtTime(panVal, audioCtx.currentTime);
                osc.connect(panner);
                panner.connect(gainNode);
            } else {
                osc.connect(gainNode);
            }

            gainNode.connect(audioCtx.destination);

            // 音量包络线 (ADSR Envelope)
            const now = audioCtx.currentTime;
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(vol, now + attack);
            gainNode.gain.exponentialRampToValueAtTime(vol * sustain, now + attack + decay);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, now + attack + decay + release);

            osc.start(now);
            osc.stop(now + attack + decay + release + 0.1);
        }

        // 🔊 静音切换控制器
        const audioToggle = document.getElementById('audioToggle');
        audioToggle.addEventListener('click', (e) => {
            isAudioMuted = !isAudioMuted;
            if (!isAudioMuted) {
                initAudio();
                audioToggle.innerText = '🔊';
                audioToggle.style.color = '#a8e6cf';
                // 播一声柔和的初始提示音
                playSfx('calm', 0.5, 0.5);
            } else {
                audioToggle.innerText = '🔇';
                audioToggle.style.color = 'rgba(255, 255, 255, 0.65)';
            }
            e.stopPropagation();
        });

        // 🌟 ----------------- 🛠️ 沙盒控制系统 -----------------
        const sandbox = document.getElementById('sandbox');
        const gearToggle = document.getElementById('gearToggle');
        
        gearToggle.addEventListener('click', (e) => {
            sandbox.classList.toggle('open');
            e.stopPropagation();
        });

        // 阻止沙盒内的所有鼠标和手势事件穿透到画布
        sandbox.addEventListener('mousedown', e => e.stopPropagation());
        sandbox.addEventListener('touchstart', e => e.stopPropagation(), {passive: true});

        // 点击空白处关闭沙盒
        window.addEventListener('mousedown', (e) => {
            if (!sandbox.contains(e.target) && e.target !== gearToggle) {
                sandbox.classList.remove('open');
            }
        });

        // ⚙️ 各种沙盒自定义滑块绑定
        let userGlowMultiplier = 1.0; // 用户自定义光晕倍率
        let userAttractMultiplier = 1.0; // 用户自定义吸引力倍率

        const pCountSlider = document.getElementById('pCountSlider');
        const pCountVal = document.getElementById('pCountVal');
        pCountSlider.addEventListener('input', (e) => {
            const count = parseInt(e.target.value);
            pCountVal.innerText = count;
            adjustParticleCount(count);
        });

        const pGlowSlider = document.getElementById('pGlowSlider');
        const pGlowVal = document.getElementById('pGlowVal');
        pGlowSlider.addEventListener('input', (e) => {
            userGlowMultiplier = parseFloat(e.target.value) / 3.8;
            pGlowVal.innerText = e.target.value;
        });

        const pAttractSlider = document.getElementById('pAttractSlider');
        const pAttractVal = document.getElementById('pAttractVal');
        pAttractSlider.addEventListener('input', (e) => {
            userAttractMultiplier = parseFloat(e.target.value);
            pAttractVal.innerText = e.target.value;
        });

        function adjustParticleCount(newCount) {
            const diff = newCount - particles.length;
            if (diff > 0) {
                for (let i = 0; i < diff; i++) {
                    particles.push(new Particle());
                }
            } else if (diff < 0) {
                particles.splice(newCount);
            }
        }

        // 🛰️ 自动屏保巡航控制
        let isAutoCruising = false;
        let cruiseTime = 0;
        const cruiseBtn = document.getElementById('cruiseBtn');

        cruiseBtn.addEventListener('click', (e) => {
            isAutoCruising = !isAutoCruising;
            if (isAutoCruising) {
                cruiseBtn.classList.add('active');
                cruiseBtn.innerText = '🛰️ 屏保巡航运行中...';
                mouse.isActive = true;
                initAudio();
            } else {
                cruiseBtn.classList.remove('active');
                cruiseBtn.innerText = '🛰️ 开启自动屏保巡航';
            }
            e.stopPropagation();
        });


        // 🌟 ----------------- 🎭 五维超大规模情绪物理参数库 -----------------
        const EMOTION_CONFIGS = {
            default: {
                primaryColor: { r: 255, g: 255, b: 255 },  // 核心微白
                glowColor: { r: 255, g: 254, b: 230 },     // 暖金光晕
                speed: 1.0,                                // 自由漂移速度系数
                ease: 1.0,                                 // 随动敏捷系数
                flicker: 1.0,                              // 闪烁频率系数
                bgAlpha: 0.08,                             // 残影系数（值越小，拖尾越长）
                title: '萤火虫之舞',
                subtitle: 'DANCE OF FIREFLIES',
                tip: '输入或点按情绪开启海洋变幻'
            },
            melancholy: { // 忧郁
                primaryColor: { r: 120, g: 180, b: 255 },  // 冰蓝核心
                glowColor: { r: 50, g: 15, b: 120 },       // 深邃蓝紫霓虹光晕
                speed: 0.22,                               // 极其缓慢的深海流淌
                ease: 0.3,                                 // 滞重感，阻力大
                flicker: 0.4,                              // 极缓的明暗过渡（像沉重的呼吸）
                bgAlpha: 0.035,                            // 极长的幽深流光拖尾
                title: '深海沉溺',
                subtitle: 'MELANCHOLY OCEAN',
                tip: '深海之中，让思绪缓慢坠落'
            },
            energetic: { // 充满能量
                primaryColor: { r: 255, g: 245, b: 160 },  // 亮白炽黄核心
                glowColor: { r: 255, g: 60, b: 0 },        // 烈焰橙红高亮光晕
                speed: 2.8,                                // 狂乱的自由流速
                ease: 2.6,                                 // 超强随动敏捷度
                flicker: 3.5,                              // 高频能量颤抖闪烁
                bgAlpha: 0.15,                             // 短而锐利的爆裂流火残影
                title: '太阳耀斑',
                subtitle: 'SOLAR FLARE ACTIVATION',
                tip: '狂热暴风！点击/滑动释放等离子合成声浪'
            },
            calm: { // 平静 / 禅意
                primaryColor: { r: 168, g: 230, b: 207 },  // 翡翠嫩绿芯
                glowColor: { r: 35, g: 120, b: 85 },       // 幽谷寂静深绿光晕
                speed: 0.45,                               // 极其轻柔规则的摆动
                ease: 0.65,                                // 温和舒缓的跟随
                flicker: 0.3,                              // 几乎不闪烁，极为温润
                bgAlpha: 0.12,                             // 干净利落，无黏附拖尾
                title: '止水微澜',
                subtitle: 'ZEN TRANQUILITY',
                tip: '静听琴鸣，看万物归于纯粹与安宁'
            },
            angry: { // 愤怒 / 暴躁
                primaryColor: { r: 255, g: 0, b: 60 },     // 沸腾血红芯
                glowColor: { r: 120, g: 0, b: 15 },        // 暗沉血煞暗红霓虹
                speed: 3.8,                                // 狂怒的流向
                ease: 3.4,                                 // 超高响应，无阻尼狂乱
                flicker: 6.0,                              // 极高频率的痛苦颤抖闪动
                bgAlpha: 0.22,                             // 瞬间生灭的暴虐残像
                title: '熔岩怒火',
                subtitle: 'RAGING LAVA ERUPTION',
                tip: '怒不可遏！点击引发暴虐重低音熔岩爆破！'
            },
            romantic: { // 浪漫
                primaryColor: { r: 255, g: 192, b: 203 },  // 樱粉核心
                glowColor: { r: 160, g: 40, b: 95 },       // 柔梦绯红玫瑰晕
                speed: 0.85,                               // 摇曳摆动
                ease: 0.75,                                // 软弹如棉花糖的拉扯感
                flicker: 1.5,                              // 带有灵动节奏的小跳跃闪烁
                bgAlpha: 0.05,                             // 优雅无比的少女粉红极光长曳
                title: '粉色星尘',
                subtitle: 'ROMANTIC STELLAE',
                tip: '满天星光，皆是宇宙回荡给你的浪漫和弦'
            }
        };

        // 当前渲染物理参数
        const currentConfig = {
            primaryColor: { r: 255, g: 255, b: 255 },
            glowColor: { r: 255, g: 254, b: 230 },
            speed: 1.0,
            ease: 1.0,
            flicker: 1.0,
            bgAlpha: 0.08
        };

        let targetConfig = EMOTION_CONFIGS.default;
        let activeEmotionName = 'default';

        const emotionInput = document.getElementById('emotionInput');
        const appTitle = document.getElementById('appTitle');
        const appSubtitle = document.getElementById('appSubtitle');
        const tipText = document.getElementById('tipText');
        const moodPanel = document.getElementById('moodPanel');

        // 统一UI色彩变幻逻辑
        function updateUIStyle(titleColor, subColor, tipColor) {
            appTitle.style.color = titleColor;
            appSubtitle.style.color = subColor;
            tipText.style.color = tipColor;
        }

        // 解析并激活情绪
        function applyEmotion(val) {
            const cleanVal = val.trim();
            let matchedKey = 'default';

            if (cleanVal === '忧郁' || cleanVal.toLowerCase() === 'melancholy') {
                matchedKey = 'melancholy';
                updateUIStyle('#78b4ff', 'rgba(120, 180, 255, 0.4)', 'rgba(120, 180, 255, 0.35)');
            } else if (cleanVal === '充满能量' || cleanVal === '能量' || cleanVal.toLowerCase() === 'energetic') {
                matchedKey = 'energetic';
                updateUIStyle('#ff3c00', 'rgba(255, 60, 0, 0.4)', 'rgba(255, 60, 0, 0.35)');
            } else if (cleanVal === '平静' || cleanVal === '禅' || cleanVal.toLowerCase() === 'calm') {
                matchedKey = 'calm';
                updateUIStyle('#a8e6cf', 'rgba(168, 230, 207, 0.4)', 'rgba(168, 230, 207, 0.35)');
            } else if (cleanVal === '愤怒' || cleanVal === '暴躁' || cleanVal.toLowerCase() === 'angry') {
                matchedKey = 'angry';
                updateUIStyle('#ff003c', 'rgba(255, 0, 60, 0.4)', 'rgba(255, 0, 60, 0.35)');
            } else if (cleanVal === '浪漫' || cleanVal === '恋爱' || cleanVal.toLowerCase() === 'romantic') {
                matchedKey = 'romantic';
                updateUIStyle('#ffb6c1', 'rgba(255, 182, 193, 0.4)', 'rgba(255, 182, 193, 0.35)');
            } else {
                matchedKey = 'default';
                updateUIStyle('#ffffff', 'rgba(255, 255, 255, 0.35)', 'rgba(255, 255, 255, 0.3)');
            }

            targetConfig = EMOTION_CONFIGS[matchedKey];
            activeEmotionName = matchedKey;
            
            appTitle.innerText = targetConfig.title;
            appSubtitle.innerText = targetConfig.subtitle;
            tipText.innerText = targetConfig.tip;

            // 同步激活物理按钮的状态类
            const buttons = moodPanel.querySelectorAll('.mood-btn');
            buttons.forEach(btn => {
                btn.className = 'mood-btn';
                const btnEmotion = btn.getAttribute('data-emotion');
                if ((matchedKey === 'default' && btnEmotion === '') || 
                    (matchedKey === 'melancholy' && btnEmotion === '忧郁') ||
                    (matchedKey === 'energetic' && btnEmotion === '能量') ||
                    (matchedKey === 'calm' && btnEmotion === '平静') ||
                    (matchedKey === 'angry' && btnEmotion === '愤怒') ||
                    (matchedKey === 'romantic' && btnEmotion === '浪漫')) {
                    btn.classList.add(`active-${matchedKey}`);
                }
            });

            // 切换状态时鸣响一次音效
            if (!isAudioMuted) {
                playSfx(matchedKey, 0.5, 0.4);
            }
        }

        // 监听手动打字输入
        emotionInput.addEventListener('input', (e) => {
            applyEmotion(e.target.value);
        });

        // 监听点击快捷按钮
        moodPanel.addEventListener('click', (e) => {
            const btn = e.target.closest('.mood-btn');
            if (!btn) return;
            const emotionVal = btn.getAttribute('data-emotion');
            emotionInput.value = emotionVal;
            applyEmotion(emotionVal);
        });

        // 线性插值辅助
        function lerp(start, end, amt) {
            return start + (end - start) * amt;
        }

        // 平滑更新物理过渡状态
        function updateInterpolation() {
            const rate = 0.025; 
            
            currentConfig.primaryColor.r = lerp(currentConfig.primaryColor.r, targetConfig.primaryColor.r, rate);
            currentConfig.primaryColor.g = lerp(currentConfig.primaryColor.g, targetConfig.primaryColor.g, rate);
            currentConfig.primaryColor.b = lerp(currentConfig.primaryColor.b, targetConfig.primaryColor.b, rate);

            currentConfig.glowColor.r = lerp(currentConfig.glowColor.r, targetConfig.glowColor.r, rate);
            currentConfig.glowColor.g = lerp(currentConfig.glowColor.g, targetConfig.glowColor.g, rate);
            currentConfig.glowColor.b = lerp(currentConfig.glowColor.b, targetConfig.glowColor.b, rate);

            currentConfig.speed = lerp(currentConfig.speed, targetConfig.speed, rate);
            currentConfig.ease = lerp(currentConfig.ease, targetConfig.ease, rate);
            currentConfig.flicker = lerp(currentConfig.flicker, targetConfig.flicker, rate);
            currentConfig.bgAlpha = lerp(currentConfig.bgAlpha, targetConfig.bgAlpha, rate);
        }

        // 鼠标与触摸状态
        const mouse = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            targetX: window.innerWidth / 2,
            targetY: window.innerHeight / 2,
            isActive: false
        };

        // 设定音频触发阈值，防止极高频率震荡，降低噪音
        let lastSfxTime = 0;
        const sfxThrottle = 65; // 音响触发节流（毫秒）

        function updateMouse(e) {
            // 如果开启了自动巡航，用户的鼠标滑动会打断自动巡航
            if (isAutoCruising) {
                isAutoCruising = false;
                cruiseBtn.classList.remove('active');
                cruiseBtn.innerText = '🛰️ 开启自动屏保巡航';
            }

            mouse.isActive = true;
            if (e.touches) {
                mouse.targetX = e.touches[0].clientX;
                mouse.targetY = e.touches[0].clientY;
            } else {
                mouse.targetX = e.clientX;
                mouse.targetY = e.clientY;
            }

            // 音色滑动跟随（当鼠标长距离拖动时发出渐变声效）
            const now = performance.now();
            if (now - lastSfxTime > sfxThrottle && mouse.isActive) {
                const normX = mouse.targetX / canvas.width;
                const normY = mouse.targetY / canvas.height;
                playSfx(activeEmotionName, normX, normY);
                lastSfxTime = now;
            }
        }

        window.addEventListener('mousemove', updateMouse);
        window.addEventListener('touchmove', updateMouse, { passive: true });
        window.addEventListener('mouseleave', () => { 
            if (!isAutoCruising) {
                mouse.isActive = false; 
            }
        });

        // 💥 等离子冲击波环
        class Shockwave {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = 260 * currentConfig.speed; 
                this.speed = (activeEmotionName === 'angry' ? 14 : 9) * currentConfig.speed;      
                this.alpha = 1.0;
            }

            update() {
                this.radius += this.speed;
                this.alpha = 1 - (this.radius / this.maxRadius);
                return this.radius < this.maxRadius;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(${Math.round(currentConfig.glowColor.r)}, ${Math.round(currentConfig.glowColor.g)}, ${Math.round(currentConfig.glowColor.b)}, ${this.alpha * 0.4})`;
                ctx.lineWidth = activeEmotionName === 'angry' ? 4 : 2; 
                ctx.stroke();
            }
        }

        const shockwaves = [];

        function triggerExplosion(x, y) {
            // 触发爆炸音效（更强的爆裂感）
            if (!isAudioMuted) {
                playSfx(activeEmotionName, x / canvas.width, y / canvas.height);
                // 叠加低音炮和音效果
                setTimeout(() => {
                    playSfx(activeEmotionName === 'default' ? 'melancholy' : activeEmotionName, x / canvas.width, Math.min(1.0, (y / canvas.height) + 0.2));
                }, 50);
            }

            if (activeEmotionName === 'calm') {
                shockwaves.push(new Shockwave(x, y));
                particles.forEach(p => {
                    const dx = p.x - x;
                    const dy = p.y - y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < 180 && dist > 0) {
                        p.pushX += (dx / dist) * 1.5;
                        p.pushY += (dy / dist) * 1.5;
                    }
                });
                return;
            }

            shockwaves.push(new Shockwave(x, y));

            particles.forEach(p => {
                const dx = p.x - x;
                const dy = p.y - y;
                const dist = Math.hypot(dx, dy);
                const maxPushRadius = (activeEmotionName === 'angry' ? 360 : 280) * currentConfig.speed;

                if (dist < maxPushRadius && dist > 0) {
                    const baseForce = activeEmotionName === 'angry' ? 36 : 24;
                    const force = (1 - dist / maxPushRadius) * baseForce * currentConfig.speed;
                    p.pushX += (dx / dist) * force;
                    p.pushY += (dy / dist) * force;
                }
            });
        }

        // 点击画布（非UI区域）触发
        window.addEventListener('mousedown', (e) => {
            if (e.target.id === 'emotionInput' || e.target.closest('#moodPanel') || e.target.closest('#sandbox') || e.target.closest('.top-controls')) return;
            triggerExplosion(e.clientX, e.clientY);
        });

        window.addEventListener('touchstart', (e) => {
            if (e.target.id === 'emotionInput' || e.target.closest('#moodPanel') || e.target.closest('#sandbox') || e.target.closest('.top-controls')) return;
            const touch = e.touches[0];
            triggerExplosion(touch.clientX, touch.clientY);
        }, { passive: true });


        // 粒子系统定义
        class Particle {
            constructor() {
                this.reset();
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
            }

            reset() {
                this.size = Math.random() * 1.6 + 0.6; 
                this.baseAlpha = Math.random() * 0.5 + 0.3; 
                this.alpha = this.baseAlpha;
                
                this.flickerSpeed = Math.random() * 0.03 + 0.01;
                this.flickerOffset = Math.random() * Math.PI * 2;
                
                this.baseEase = Math.random() * 0.04 + 0.01; 
                
                this.offsetX = (Math.random() - 0.5) * 160;
                this.offsetY = (Math.random() - 0.5) * 160;
                
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;

                this.pushX = 0;
                this.pushY = 0;
            }

            update(tick) {
                // 1. 闪烁
                const tickFactor = tick * currentConfig.flicker;
                this.alpha = this.baseAlpha + Math.sin(tickFactor * this.flickerSpeed + this.flickerOffset) * 0.25;
                if (this.alpha < 0) this.alpha = 0;

                // 2. 运动物理机制
                let targetX, targetY;
                const dynamicOffsetAmp = 160 * currentConfig.speed;

                if (activeEmotionName === 'calm') {
                    if (mouse.isActive) {
                        const zenAngle = tick * 0.012 + this.flickerOffset;
                        const radius = 60 + Math.sin(tick * 0.005 + this.flickerOffset) * 40;
                        targetX = mouse.x + Math.cos(zenAngle) * radius;
                        targetY = mouse.y + Math.sin(zenAngle) * radius;
                    } else {
                        const centerAngle = tick * 0.005 + this.flickerOffset;
                        targetX = (canvas.width / 2) + Math.cos(centerAngle) * 120;
                        targetY = (canvas.height / 2) + Math.sin(centerAngle) * 120;
                    }
                } else if (mouse.isActive) {
                    targetX = mouse.x + (this.offsetX / 160) * dynamicOffsetAmp;
                    targetY = mouse.y + (this.offsetY / 160) * dynamicOffsetAmp;
                    
                    this.offsetX += Math.sin(tickFactor * 0.01 + this.flickerOffset) * 0.3 * currentConfig.speed;
                    this.offsetY += Math.cos(tickFactor * 0.01 + this.flickerOffset) * 0.3 * currentConfig.speed;
                } else {
                    const centerAngle = tick * 0.001 * currentConfig.speed + this.flickerOffset;
                    targetX = (canvas.width / 2) + Math.cos(centerAngle) * 100;
                    targetY = (canvas.height / 2) + Math.sin(centerAngle) * 100;
                }

                // 阻尼吸引随动
                const activeEase = this.baseEase * currentConfig.ease * userAttractMultiplier;
                this.x += (targetX - this.x) * activeEase;
                this.y += (targetY - this.y) * activeEase;

                // 衰减冲量
                this.pushX *= 0.92;
                this.pushY *= 0.92;
                this.x += this.pushX;
                this.y += this.pushY;

                // 浪漫浮力
                const buoyancyY = activeEmotionName === 'romantic' ? -0.45 : 0;

                this.x += this.vx * currentConfig.speed;
                this.y += (this.vy * currentConfig.speed) + buoyancyY;

                // 浪漫越界边界处理
                if (this.y < -10) {
                    this.y = canvas.height + 10;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                const rP = Math.round(currentConfig.primaryColor.r);
                const gP = Math.round(currentConfig.primaryColor.g);
                const bP = Math.round(currentConfig.primaryColor.b);

                const rG = Math.round(currentConfig.glowColor.r);
                const gG = Math.round(currentConfig.glowColor.g);
                const bG = Math.round(currentConfig.glowColor.b);

                const dynamicSize = this.size;
                const glowSizeMultiplier = 3.8 * userGlowMultiplier;

                // 1. 绘制亮芯
                ctx.beginPath();
                ctx.arc(this.x, this.y, dynamicSize, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${rP}, ${gP}, ${bP}, ${this.alpha})`;
                ctx.fill();

                // 2. 绘制荧光光晕
                ctx.beginPath();
                ctx.arc(this.x, this.y, dynamicSize * glowSizeMultiplier, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${rG}, ${gG}, ${bG}, ${this.alpha * 0.35})`;
                ctx.fill();
            }
        }

        // 初始化粒子群
        const particles = [];
        adjustParticleCount(280); // 默认 280

        let tick = 0;

        function animate() {
            // 平滑计算色彩和物理参数插值
            updateInterpolation();

            // 动态拖尾
            ctx.fillStyle = `rgba(0, 0, 0, ${currentConfig.bgAlpha})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 🛰️ 自动巡航屏保计算（利用利萨茹曲线）
            if (isAutoCruising) {
                cruiseTime += 0.012;
                // 计算拟人化流动轨迹
                mouse.targetX = canvas.width / 2 + Math.cos(cruiseTime * 0.8) * (canvas.width * 0.38) * Math.sin(cruiseTime * 0.4);
                mouse.targetY = canvas.height / 2 + Math.sin(cruiseTime * 1.1) * (canvas.height * 0.35);

                // 自动产生柔和音响律动
                const now = performance.now();
                if (now - lastSfxTime > 250) { // 巡航模式下音效触发间隔拉长，如同风铃
                    const normX = mouse.targetX / canvas.width;
                    const normY = mouse.targetY / canvas.height;
                    playSfx(activeEmotionName, normX, normY);
                    lastSfxTime = now;
                }
            }

            // 更新绘制视觉冲击波
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const s = shockwaves[i];
                if (s.update()) {
                    s.draw();
                } else {
                    shockwaves.splice(i, 1);
                }
            }

            // 随动
            const mouseEase = (activeEmotionName === 'calm' ? 0.04 : 0.08) * currentConfig.ease * userAttractMultiplier;
            mouse.x += (mouse.targetX - mouse.x) * mouseEase;
            mouse.y += (mouse.targetY - mouse.y) * mouseEase;

            tick++;

            for (let i = 0; i < particles.length; i++) {
                particles[i].update(tick);
                particles[i].draw();
            }

            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
